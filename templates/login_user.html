{% extends 'base.html' %}
{% block title %}Masuk Pelanggan - KartuTa{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 px-4">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Masuk Akun Pengguna</h1>
            <p class="text-sm text-slate-500 mt-1">Akses Virtual Binder dan koleksi photocard kamu</p>
        </div>

        <form method="POST" action="{% url 'login_user' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Username</label>
                <input type="text" name="username" required autofocus
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <button type="submit"
                class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition shadow-sm">
                Masuk ke KartuTa
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            Belum punya akun? 
            <a href="{% url 'register_user' %}" class="font-semibold text-blue-600 hover:underline">Daftar sekarang</a>
        </div>
    </div>
</div>
{% endblock %}
