{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=5.4">

<body class="pro-body">

        <p style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-hint); margin: 0;">Error 404</p>

        <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px;">
            <a href="{% url 'home' %}" class="btn-hero-solid">Kembali ke etalase</a>
