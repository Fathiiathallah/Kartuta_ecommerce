{% extends 'base.html' %}
{% block title %}Daftar Pelanggan Baru - KartuTa{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto my-10 px-4">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Registrasi Pengguna</h1>
            <p class="text-sm text-slate-500 mt-1">Buat akun untuk mulai mengoleksi photocard official</p>
        </div>

        <form method="POST" action="{% url 'register_user' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Username <span class="text-rose-500">*</span></label>
                <input type="text" name="username" required
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                    placeholder="misal: fandom_kartuta">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Email <span class="text-rose-500">*</span></label>
                <input type="email" name="email" required
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                    placeholder="nama@email.com">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nomor WhatsApp / HP</label>
                <input type="text" name="phone_number"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                    placeholder="08123456789">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Alamat Pengiriman</label>
                <textarea name="shipping_address" rows="2"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                    placeholder="Jl. Merpati No. 12, Makassar..."></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Password <span class="text-rose-500">*</span></label>
                <input type="password" name="password" required
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <button type="submit"
                class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition shadow-sm">
                Daftar Akun Baru
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            Sudah punya akun? 
            <a href="{% url 'login_user' %}" class="font-semibold text-blue-600 hover:underline">Masuk disini</a>
        </div>
    </div>
</div>
{% endblock %}
