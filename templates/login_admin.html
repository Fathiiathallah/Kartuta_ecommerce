{% extends 'base.html' %}
{% block title %}Login Internal Admin - KartuTa{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-14 px-4">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <div class="text-center mb-6">
            <span class="inline-block p-3 rounded-2xl bg-slate-900 text-white text-xl mb-2">🛡️</span>
            <h1 class="text-2xl font-bold text-slate-900">Portal Akses Admin</h1>
            <p class="text-xs text-slate-500 mt-1">Khusus staf operasional, QC, dan manajemen KartuTa</p>
        </div>

        <form method="POST" action="{% url 'login_admin' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Username Admin</label>
                <input type="text" name="username" required autofocus
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-800 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-800 text-sm">
            </div>

            <button type="submit"
                class="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-xl text-sm transition shadow-sm">
                Masuk Dashboard Admin
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            Bukan staf admin? 
            <a href="{% url 'login_user' %}" class="font-semibold text-blue-600 hover:underline">Masuk sebagai Pengguna</a>
        </div>
    </div>
</div>
{% endblock %}
